/* =========================================================================
   NAJAH.ma — Persistance
   Tout ce que le candidat produit survit au rechargement.
   Écriture versionnée, migration sûre, tentatives idempotentes.
   ========================================================================= */

const STORE_KEY = 'najah.state';
const STORE_VERSION = 3;

const BLANK = () => ({
  v: STORE_VERSION,
  parcours: null,          // { concours, specialite, cycle, session, langueSE, tempsParSemaine }
  attempts: [],            // { key, qid, ep, sub, answer, correct, certitude, ts, mode }
  diagnostic: null,        // { started, plan:[{ep,sub,qid}], i, done, ts }
  mastery: {},             // subId -> { state, evidence, correct, seen, lastTs, sureWrong }
  errors: {},              // qid -> entrée de carnet
  recalls: [],             // { qid, sub, due, interval, tries, done }
  mirrorsDone: {},         // qid -> résultat de la question miroir
  remediations: {},        // subId -> { status, ts }
  sims: {},                // epId -> { key, ids, answers, certitudes, left, started, submitted, report }
  seenMissions: []
});

let ST = null;

function storeLoad() {
  if (ST) return ST;
  let raw = null;
  try { raw = localStorage.getItem(STORE_KEY); } catch (e) { raw = null; }
  if (!raw) { ST = BLANK(); return ST; }
  let data;
  try { data = JSON.parse(raw); } catch (e) { data = null; }
  if (!data || typeof data !== 'object') { ST = BLANK(); return ST; }
  ST = storeMigrate(data);
  return ST;
}

/* Migration : un état ancien ne doit jamais faire planter l'application.
   On complète les champs manquants au lieu de tout effacer. */
function storeMigrate(data) {
  const fresh = BLANK();
  if (typeof data.v !== 'number' || data.v > STORE_VERSION) {
    // Version inconnue ou future : on repart d'un état propre en conservant une copie
    try { localStorage.setItem(STORE_KEY + '.backup', JSON.stringify(data)); } catch (e) {}
    return fresh;
  }
  Object.keys(fresh).forEach(k => {
    if (data[k] === undefined || data[k] === null) return;
    if (Array.isArray(fresh[k]) && !Array.isArray(data[k])) return;
    if (!Array.isArray(fresh[k]) && typeof fresh[k] === 'object' && typeof data[k] !== 'object') return;
    fresh[k] = data[k];
  });
  fresh.v = STORE_VERSION;
  return fresh;
}

function storeSave() {
  if (!ST) return;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(ST)); }
  catch (e) { /* quota ou mode privé : l'application continue de fonctionner en mémoire */ }
}

function storeReset() {
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  ST = BLANK();
}

/* Accès unique à l'état persistant */
function st() { return storeLoad(); }

/* -------------------------------------------------------------------------
   Tentatives idempotentes
   La clé est déterministe : même question, même mode, même session de travail
   → une seule tentative, quel que soit le nombre de clics ou de rechargements.
   ------------------------------------------------------------------------- */
function attemptKey(qid, mode, session) { return [mode || 'libre', session || 'x', qid].join('|'); }

function recordAttempt(o) {
  const s = st();
  const key = attemptKey(o.qid, o.mode, o.session);
  const existing = s.attempts.find(a => a.key === key);
  if (existing) {                       // double soumission : on met à jour, on ne duplique pas
    existing.answer = o.answer;
    existing.correct = o.correct;
    existing.certitude = o.certitude;
    existing.ts = o.ts || existing.ts;
    storeSave();
    return { attempt: existing, created: false };
  }
  const a = {
    key, qid: o.qid, ep: o.ep || null, sub: o.sub || null,
    answer: o.answer, correct: !!o.correct, certitude: o.certitude || null,
    ts: o.ts || nowTs(), mode: o.mode || 'libre'
  };
  s.attempts.push(a);
  storeSave();
  return { attempt: a, created: true };
}

/* Horodatage : une seule source, pour rester testable */
function nowTs() { return Date.now(); }
function dayMs() { return 86400000; }

/* =========================================================================
   NAJAH.ma — La Boucle Najah
   Réponse → certitude → correction → distracteurs → confusion probable →
   source → remédiation → question miroir → rappel différé → progression.

   Deux principes gouvernent tout ce fichier :
     1. Une seule bonne réponse ne prouve jamais une maîtrise.
     2. Une cause d'erreur est une hypothèse, jamais un diagnostic.
   ========================================================================= */

/* ---------------- Certitude déclarée ---------------- */
const CERTITUDES = [
  { id: 'sur',      label: 'Sûr',        icon: 'shield', weight: 1.0 },
  { id: 'hesitant', label: 'Hésitant',   icon: 'bulb',   weight: 0.5 },
  { id: 'hasard',   label: 'Au hasard',  icon: 'refresh', weight: 0.15 }
];
const certOf = id => CERTITUDES.find(c => c.id === id) || CERTITUDES[1];

/* Lecture croisée réponse × certitude — matrice du document fonctionnel (F02) */
function readCertitude(correct, cert) {
  if (correct && cert === 'sur')       return { key: 'solide',       label: 'Maîtrise probablement solide', prio: 3, kind: 'good' };
  if (correct && cert !== 'sur')       return { key: 'fragile',      label: 'Bonne réponse, mais peu assurée', prio: 2, kind: 'warn' };
  if (!correct && cert !== 'sur')      return { key: 'lacune',       label: 'Lacune consciente', prio: 1, kind: 'warn' };
  return { key: 'fausse_croyance',     label: 'Fausse croyance — priorité haute', prio: 0, kind: 'crit' };
}

/* ---------------- États de maîtrise ----------------
   Une maîtrise se construit sur des preuves : plusieurs réponses, dans le
   temps, avec une certitude cohérente. Jamais sur une seule réponse.
   ------------------------------------------------------------------- */
function masteryOfSub(subId) {
  const s = st();
  const m = s.mastery[subId];
  if (!m || !m.seen) return { state: 'non_evaluee', seen: 0, correct: 0, evidence: 0, ratio: 0, sureWrong: 0, spaced: 0 };
  return m;
}

function recomputeMastery(subId) {
  const s = st();
  const rel = s.attempts.filter(a => a.sub === subId);
  if (!rel.length) { delete s.mastery[subId]; storeSave(); return masteryOfSub(subId); }

  const seen = rel.length;
  const correct = rel.filter(a => a.correct).length;
  const ratio = correct / seen;
  const sureWrong = rel.filter(a => !a.correct && a.certitude === 'sur').length;
  // Poids de preuve : une réponse au hasard vaut peu, une réponse sûre vaut plein
  const evidence = rel.reduce((acc, a) => acc + certOf(a.certitude).weight, 0);
  // Réussites espacées : bonnes réponses séparées d'au moins un jour
  const goods = rel.filter(a => a.correct).map(a => a.ts).sort((x, y) => x - y);
  let spaced = goods.length ? 1 : 0;
  for (let i = 1; i < goods.length; i++) if (goods[i] - goods[i - 1] >= dayMs()) spaced++;
  // Le miroir compte comme preuve de transfert
  const mirrorOk = Object.entries(s.mirrorsDone)
    .filter(([qid, r]) => r.sub === subId && r.correct).length;

  let state;
  if (seen < 2 || evidence < 1.5)                       state = 'en_cours';
  if (seen >= 2 && ratio < 0.5)                         state = 'fragile';
  else if (sureWrong > 0 && ratio < 0.75)               state = 'fragile';
  else if (seen >= 2 && ratio >= 0.5 && ratio < 0.8)    state = 'en_cours';
  else if (ratio >= 0.8 && (spaced < 2 || mirrorOk < 1)) state = 'a_consolider';
  else if (ratio >= 0.8 && spaced >= 2 && mirrorOk >= 1) state = 'consolidee';
  if (seen < 2) state = 'en_cours';                     // jamais consolidé sur une seule réponse

  const m = { state, seen, correct, ratio: +ratio.toFixed(2), evidence: +evidence.toFixed(2), sureWrong, spaced, mirrorOk, lastTs: Math.max(...rel.map(a => a.ts)) };
  s.mastery[subId] = m;
  storeSave();
  return m;
}

function masteryLabel(stateId) {
  const s = DATA.crmef.masteryStates.find(x => x.id === stateId);
  return s || DATA.crmef.masteryStates[0];
}

/* ---------------- Confusion probable ----------------
   Présentée comme hypothèse. Le candidat peut la corriger ou l'ignorer.
   ------------------------------------------------------------------- */
function probableConfusion(q, answer) {
  if (!q || answer === q.correct) return null;
  return {
    hypothese: q.trap || null,
    distracteur: answer,
    texte: q.choices.find(c => c.k === answer) ? q.choices.find(c => c.k === answer).t : '',
    justification: q.rationales ? q.rationales[answer] : '',
    // formulation volontairement prudente
    formule: "Hypothèse, à confirmer par vous"
  };
}

/* ---------------- Question miroir ----------------
   Même sous-domaine, question différente, de préférence d'un autre niveau
   cognitif : on vérifie un transfert, pas une mémorisation.
   ------------------------------------------------------------------- */
function pickMirror(q) {
  if (!q || !q.sub) return null;
  const pool = subQuestions(q.sub).filter(x => x.id !== q.id);
  if (!pool.length) return null;
  const other = pool.filter(x => x.cog !== q.cog);
  return (other.length ? other : pool)[0];
}

function recordMirror(originQid, mirrorQid, correct, sub) {
  const s = st();
  s.mirrorsDone[originQid] = { mirror: mirrorQid, correct: !!correct, sub, ts: nowTs() };
  // Une réussite au miroir ne clôt pas la fragilité : elle avance le rappel, sans plus
  const e = s.errors[originQid];
  if (e) { e.mirror = correct ? 'réussie' : 'échouée'; e.ts = nowTs(); }
  storeSave();
  recomputeMastery(sub);
}

/* ---------------- Rappel différé ----------------
   J+1, J+3, J+7, J+15. Un échec rapproche l'échéance.
   La vérification utilise une AUTRE question que celle d'origine.
   ------------------------------------------------------------------- */
const RECALL_STEPS = [1, 3, 7, 15];

function scheduleRecall(qid, sub, failed) {
  const s = st();
  let r = s.recalls.find(x => x.qid === qid);
  if (!r) { r = { qid, sub, step: 0, tries: 0, done: false, due: 0 }; s.recalls.push(r); }
  if (failed) r.step = Math.max(0, r.step - 1);
  const days = RECALL_STEPS[Math.min(r.step, RECALL_STEPS.length - 1)];
  r.due = nowTs() + days * dayMs();
  r.dueDays = days;
  storeSave();
  return r;
}
function advanceRecall(qid, ok) {
  const s = st();
  const r = s.recalls.find(x => x.qid === qid);
  if (!r) return null;
  r.tries++;
  if (ok) { r.step++; if (r.step >= RECALL_STEPS.length) { r.done = true; } }
  else r.step = Math.max(0, r.step - 1);
  const days = RECALL_STEPS[Math.min(r.step, RECALL_STEPS.length - 1)];
  r.due = nowTs() + days * dayMs();
  r.dueDays = days;
  storeSave();
  return r;
}
function dueRecalls() {
  const s = st();
  const now = nowTs();
  return s.recalls.filter(r => !r.done && r.due <= now);
}
/* Pour le rappel, on prend une question DIFFÉRENTE du même sous-domaine */
function recallQuestion(r) {
  const pool = subQuestions(r.sub).filter(q => q.id !== r.qid);
  return pool.length ? pool[0] : DATA.questions.find(q => q.id === r.qid);
}

/* ---------------- Carnet d'erreurs ---------------- */
function upsertError(q, answer, certitude) {
  const s = st();
  const conf = probableConfusion(q, answer);
  const prev = s.errors[q.id];
  s.errors[q.id] = {
    qid: q.id, ep: q.ep, sub: q.sub,
    answer, expected: q.correct, certitude,
    lecture: readCertitude(false, certitude).key,
    confusion: conf ? conf.hypothese : null,
    mirror: prev ? prev.mirror : null,
    remediation: prev ? prev.remediation : 'proposée',
    ts: nowTs(), count: prev ? prev.count + 1 : 1
  };
  storeSave();
  return s.errors[q.id];
}
function errorList(filter) {
  const s = st();
  let list = Object.values(s.errors);
  if (!filter) return list;
  if (filter.ep) list = list.filter(e => e.ep === filter.ep);
  if (filter.sub) list = list.filter(e => e.sub === filter.sub);
  if (filter.remed) list = list.filter(e => e.remediation === filter.remed);
  if (filter.due) {
    const due = dueRecalls().map(r => r.qid);
    list = list.filter(e => due.includes(e.qid));
  }
  return list;
}

/* ---------------- Traitement complet d'une réponse ----------------
   Point d'entrée unique de la boucle : tout passe par ici.
   ------------------------------------------------------------------- */
function submitAnswer(o) {
  const q = DATA.questions.find(x => x.id === o.qid);
  if (!q) return null;
  const correct = o.answer === q.correct;
  const res = recordAttempt({
    qid: q.id, ep: q.ep, sub: q.sub, answer: o.answer, correct,
    certitude: o.certitude, mode: o.mode, session: o.session
  });
  if (q.sub) recomputeMastery(q.sub);
  if (!correct) { upsertError(q, o.answer, o.certitude); if (q.sub) scheduleRecall(q.id, q.sub, true); }
  else if (o.certitude !== 'sur' && q.sub) scheduleRecall(q.id, q.sub, false);
  return {
    created: res.created, correct,
    lecture: readCertitude(correct, o.certitude),
    confusion: probableConfusion(q, o.answer),
    mirror: correct && o.certitude === 'sur' ? null : pickMirror(q)
  };
}

/* ---------------- Prochaine mission ----------------
   Une seule activité prioritaire, avec sa raison affichable.
   ------------------------------------------------------------------- */
function nextMission() {
  const s = st();
  if (!s.parcours) return { type: 'config', title: 'Configurer votre parcours', why: "Aucun parcours n'est encore enregistré : le concours, le cycle et la langue déterminent tout le reste.", route: '#/app/parcours/crmef' };

  const due = dueRecalls();
  if (due.length) {
    const r = due[0]; const sub = SUB(r.sub);
    return { type: 'recall', title: `Rappel différé — ${sub ? sub.name : r.sub}`,
      why: `Vous aviez travaillé ce point il y a ${Math.max(1, Math.round((nowTs() - (r.due - (r.dueDays || 1) * dayMs())) / dayMs()))} jour(s). La vérification utilise une autre question, pour mesurer un souvenir et non une reconnaissance.`,
      route: '#/app/parcours/crmef/entrainement?mode=rappels' };
  }
  if (!s.diagnostic || !s.diagnostic.done) {
    const started = s.diagnostic && s.diagnostic.i > 0;
    return { type: 'diagnostic', title: started ? 'Reprendre le diagnostic' : 'Commencer le diagnostic',
      why: started ? `Vous étiez à la question ${s.diagnostic.i + 1}. Vos réponses sont conservées.` : "Sans diagnostic, toute recommandation serait une supposition. Il couvre les trois épreuves selon leurs poids officiels.",
      route: '#/app/parcours/crmef/diagnostic' };
  }
  // Fragilité la plus lourde au regard du poids officiel
  const weak = ALL_SUBS()
    .map(sub => ({ sub, m: masteryOfSub(sub.id) }))
    .filter(x => ['fragile', 'en_cours'].includes(x.m.state) && subQuestions(x.sub.id).length)
    .sort((a, b) => (b.sub.weight - a.sub.weight) || (a.m.ratio - b.m.ratio))[0];
  if (weak) {
    return { type: 'remediation', title: `Corriger : ${weak.sub.name}`,
      why: `État « ${masteryLabel(weak.m.state).label} » sur ${weak.m.seen} réponse(s). Ce sous-domaine pèse ${weak.sub.weight} % de l'épreuve ${EP(weak.sub.ep).name} — c'est là que l'effort rapporte le plus.`,
      route: '#/app/parcours/crmef/apprendre/' + weak.sub.id, sub: weak.sub.id };
  }
  // Sinon : couvrir un sous-domaine jamais évalué
  const never = ALL_SUBS().filter(sub => masteryOfSub(sub.id).state === 'non_evaluee' && subQuestions(sub.id).length)
    .sort((a, b) => b.weight - a.weight)[0];
  if (never) {
    return { type: 'couverture', title: `Découvrir : ${never.name}`,
      why: `Ce sous-domaine n'a jamais été évalué et pèse ${never.weight} % de l'épreuve ${EP(never.ep).name}.`,
      route: '#/app/parcours/crmef/apprendre/' + never.id, sub: never.id };
  }
  return { type: 'simulation', title: 'Passer une simulation par épreuve',
    why: "Vos sous-domaines couverts sont au moins en cours d'acquisition. Une simulation par épreuve mesure l'endurance et la gestion du temps.",
    route: '#/app/parcours/crmef/simulations' };
}

/* ---------------- Frise du parcours ---------------- */
function parcoursStages() {
  const s = st();
  const diagDone = s.diagnostic && s.diagnostic.done;
  const evaluated = ALL_SUBS().filter(x => masteryOfSub(x.id).state !== 'non_evaluee').length;
  const remediated = Object.keys(s.remediations).length;
  const trained = s.attempts.filter(a => a.mode === 'entrainement').length;
  const simulated = Object.values(s.sims).filter(x => x.submitted).length;
  const consolidated = ALL_SUBS().filter(x => masteryOfSub(x.id).state === 'consolidee').length;
  return [
    { id: 'decouverte', name: 'Découverte', done: !!s.parcours },
    { id: 'diagnostic', name: 'Diagnostic', done: !!diagDone, partial: !!(s.diagnostic && !diagDone) },
    { id: 'fondations', name: 'Fondations', done: evaluated >= 6, partial: evaluated > 0 },
    { id: 'remediation', name: 'Remédiation', done: remediated >= 3, partial: remediated > 0 },
    { id: 'entrainement', name: 'Entraînement', done: trained >= 20, partial: trained > 0 },
    { id: 'simulations', name: 'Simulations', done: simulated >= 3, partial: simulated > 0 },
    { id: 'consolidation', name: 'Consolidation', done: consolidated >= 8, partial: consolidated > 0 }
  ];
}

/* ---------------- Utilitaires ---------------- */
const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

/* Rend **gras** et les sauts de ligne, en échappant tout le reste */
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');

const fmtDate = iso => {
  const M = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  const d = new Date(iso + 'T00:00:00');
  return d.getDate() + ' ' + M[d.getMonth()] + ' ' + d.getFullYear();
};
const daysUntil = iso => Math.round((new Date(iso + 'T00:00:00') - new Date('2026-08-04T00:00:00')) / 864e5);
const mmss = s => Math.floor(s / 60).toString().padStart(2, '0') + ':' + (s % 60).toString().padStart(2, '0');
const shuffleSeeded = (arr, seed) => {
  const a = arr.slice(); let s = seed;
  for (let i = a.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor(s / 233280 * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
};

/* ---------------- Graphiques (SVG, sans dépendance) ----------------
   Règles appliquées : une seule échelle par axe, marques fines, grille
   discrète, étiquettes directes, légende dès deux séries, survol partout.

let TIP;
function tipInit() {
  if (TIP) return;
  TIP = document.createElement('div'); TIP.className = 'tip'; document.body.appendChild(TIP);
  document.addEventListener('mousemove', e => {
    if (!TIP.classList.contains('on')) return;
    const x = e.clientX + 14, y = e.clientY - 10;
    TIP.style.insetInlineStart = 'auto'; TIP.style.left = Math.min(x, innerWidth - 240) + 'px'; TIP.style.top = y + 'px';
  });
}
function tipOn(html) { tipInit(); TIP.innerHTML = html; TIP.classList.add('on'); }
function tipOff() { if (TIP) TIP.classList.remove('on'); }

/* Radar des piliers — 3 axes agrégés, ou radar de compétences */
function radarChart(items, opts) {
  opts = opts || {};
  const size = opts.size || 300, cx = size / 2, cy = size / 2, R = size / 2 - 42;
  const n = items.length, step = (Math.PI * 2) / n;
  const pt = (i, r) => {
    const a = -Math.PI / 2 + i * step;
    return [cx + Math.cos(a) * r * R / 100, cy + Math.sin(a) * r * R / 100];
  };
  let rings = '';
  [25, 50, 75, 100].forEach(r => {
    const p = items.map((_, i) => pt(i, r).join(',')).join(' ');
    rings += `<polygon points="${p}" fill="none" stroke="var(--viz-grid)" stroke-width="1"/>`;
  });
  let spokes = items.map((_, i) => {
    const [x, y] = pt(i, 100);
    return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--viz-grid)" stroke-width="1"/>`;
  }).join('');
  const poly = items.map((it, i) => pt(i, it.score).join(',')).join(' ');
  const dots = items.map((it, i) => {
    const [x, y] = pt(i, it.score);
    return `<circle cx="${x}" cy="${y}" r="4.5" fill="${it.color || 'var(--series-1)'}" stroke="var(--surface-2)" stroke-width="2"
      data-tip="${esc(it.label)} — ${it.score}/100" class="vz"/>`;
  }).join('');
  const labels = items.map((it, i) => {
    const [x, y] = pt(i, 122);
    const anchor = Math.abs(x - cx) < 6 ? 'middle' : (x > cx ? 'start' : 'end');
    return `<text x="${x}" y="${y}" text-anchor="${anchor}" dominant-baseline="middle"
      font-size="11" font-weight="600" fill="var(--ink-2)">${esc(it.short || it.label)}</text>
      <text x="${x}" y="${y + 13}" text-anchor="${anchor}" dominant-baseline="middle"
      font-size="10.5" fill="var(--ink-3)">${it.score}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" width="100%" height="${size}" role="img" aria-label="Radar de maîtrise">
    ${rings}${spokes}
    <polygon points="${poly}" fill="var(--series-1)" fill-opacity=".14" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round"/>
    ${dots}${labels}</svg>`;
}

/* Courbe multi-séries */
function lineChart(rows, series, opts) {
  opts = opts || {};
  const W = 560, H = opts.height || 210, P = { t: 14, r: 16, b: 26, l: 30 };
  const iw = W - P.l - P.r, ih = H - P.t - P.b;
  const max = 100, x = i => P.l + (iw * i) / (rows.length - 1), y = v => P.t + ih - (v / max) * ih;
  let grid = '';
  [0, 25, 50, 75, 100].forEach(v => {
    grid += `<line x1="${P.l}" y1="${y(v)}" x2="${W - P.r}" y2="${y(v)}" stroke="var(--viz-grid)" stroke-width="1"/>
             <text x="${P.l - 7}" y="${y(v) + 3.5}" text-anchor="end" font-size="10" fill="var(--ink-3)">${v}</text>`;
  });
  let xl = rows.map((r, i) => `<text x="${x(i)}" y="${H - 7}" text-anchor="middle" font-size="10" fill="var(--ink-3)">${esc(r.d)}</text>`).join('');
  let paths = series.map(s => {
    const d = rows.map((r, i) => (i ? 'L' : 'M') + x(i) + ' ' + y(r[s.key])).join(' ');
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
  }).join('');
  // Étiquettes de fin décalées verticalement pour éviter les collisions
  const li = rows.length - 1;
  const ranked = series.map(s => ({ s, v: rows[li][s.key] })).sort((a, b) => b.v - a.v);
  let prevY = -Infinity;
  ranked.forEach(r => { let ly = y(r.v) + 4; if (ly - prevY < 14) ly = prevY + 14; r.ly = ly; prevY = ly; });
  let ends = ranked.map(r => `
    <circle cx="${x(li)}" cy="${y(r.v)}" r="4" fill="${r.s.color}" stroke="var(--surface-2)" stroke-width="2"/>
    <text x="${x(li) - 9}" y="${r.ly}" text-anchor="end" font-size="11" font-weight="700" fill="${r.s.color}">${r.v}</text>`).join('');
  let hot = rows.map((r, i) => {
    const t = series.map(s => `${esc(s.label)} : ${r[s.key]}`).join('<br>');
    return `<rect x="${x(i) - iw / (rows.length * 2)}" y="${P.t}" width="${iw / rows.length}" height="${ih}" fill="transparent"
      class="vz" data-tip="<b>${esc(r.d)}</b><br>${t}"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="Évolution de la maîtrise">
    ${grid}${xl}${paths}${ends}${hot}</svg>`;
}

/* Barres horizontales */
function barsChart(items, opts) {
  opts = opts || {};
  const bh = 26, gap = 9, W = 560, labelW = opts.labelW || 168;
  const H = items.length * (bh + gap);
  const iw = W - labelW - 46;
  const maxChars = Math.floor((labelW - 8) / 5.7);
  const cut = s => s.length > maxChars ? s.slice(0, maxChars - 1).trimEnd() + '…' : s;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="${esc(opts.aria || 'Barres')}">
    ${items.map((it, i) => {
      const yy = i * (bh + gap);
      const w = Math.max(2, (it.value / (opts.max || 100)) * iw);
      return `<text x="0" y="${yy + bh / 2 + 4}" font-size="11.5" fill="var(--ink-2)"><title>${esc(it.label)}</title>${esc(cut(it.label))}</text>
        <rect x="${labelW}" y="${yy}" width="${iw}" height="${bh}" rx="6" fill="var(--surface-3)"/>
        <rect x="${labelW}" y="${yy}" width="${w}" height="${bh}" rx="6" fill="${it.color || 'var(--series-1)'}" class="vz"
          data-tip="${esc(it.label)} — ${esc(it.tip || it.value)}"/>
        <text x="${labelW + iw + 8}" y="${yy + bh / 2 + 4}" font-size="11.5" font-weight="700" fill="var(--ink-2)">${esc(it.value + (opts.unit || ''))}</text>`;
    }).join('')}</svg>`;
}

/* Calendrier d'activité */
function activityChart(days) {
  const cell = 15, gap = 4, cols = Math.ceil(days.length / 7);
  const W = cols * (cell + gap), H = 7 * (cell + gap);
  const shade = v => v === 0 ? 'var(--surface-3)' : v === 1 ? 'var(--brand-100)' : v === 2 ? 'var(--brand-300)' : v === 3 ? 'var(--brand-600)' : 'var(--brand-800)';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="Activité des 4 dernières semaines">
    ${days.map((v, i) => {
      const c = Math.floor(i / 7), r = i % 7;
      return `<rect x="${c * (cell + gap)}" y="${r * (cell + gap)}" width="${cell}" height="${cell}" rx="3.5" fill="${shade(v)}"
        class="vz" data-tip="Jour ${i + 1} — ${v} série${v > 1 ? 's' : ''}"/>`;
    }).join('')}</svg>`;
}

/* Distribution des distracteurs */
function distractorBars(q) {
  const keys = q.choices.map(c => c.k);
  return `<div class="col" style="gap:7px">${keys.map(k => {
    const v = Math.round((q.stats.distractors[k] || 0) * 100);
    const ok = k === q.correct;
    return `<div class="row" style="gap:10px">
      <span class="rat-key ${ok ? 'ok' : 'no'}" style="width:20px;height:20px">${k}</span>
      <div class="bar" style="flex:1"><span style="width:${v}%;background:${ok ? 'var(--good)' : 'var(--line-strong)'}"></span></div>
      <span class="mono xsmall" style="width:34px;text-align:end">${v} %</span></div>`;
  }).join('')}</div>`;
}

/* Apparition au défilement — désactivée si l'utilisateur réduit les animations */
let REVEAL, REVEAL_FUSE;
function bindReveal(root) {
  const els = (root || document).querySelectorAll('.rise');
  if (!els.length) return;
  const can = 'IntersectionObserver' in window && !matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!can) { document.documentElement.classList.remove('js-anim'); return; }
  document.documentElement.classList.add('js-anim');
  // Filet de sécurité : rien ne doit rester invisible si l'observateur ne se déclenche pas.
  clearTimeout(REVEAL_FUSE);
  REVEAL_FUSE = setTimeout(() => els.forEach(e => e.classList.add('seen')), 2500);
  if (!REVEAL) REVEAL = new IntersectionObserver(en => {
    en.forEach(x => { if (x.isIntersecting) { x.target.classList.add('seen'); REVEAL.unobserve(x.target); } });
  }, { rootMargin: '0px 0px -8% 0px', threshold: .05 });
  els.forEach(e => {
    if (e.getBoundingClientRect().top < innerHeight * 1.05) e.classList.add('seen');
    else REVEAL.observe(e);
  });
}

function bindViz(root) {
  (root || document).querySelectorAll('.vz').forEach(el => {
    el.style.cursor = 'default';
    el.addEventListener('mouseenter', () => tipOn(el.dataset.tip));
    el.addEventListener('mouseleave', tipOff);
  });
}

/* ---------------- Routeur ---------------- */
const ROUTES = {};
function route(path, fn) { ROUTES[path] = fn; }

function navigate(hash) {
  // Une ancre identique ne déclenche pas hashchange : on rend explicitement.
  if (location.hash === hash) render(); else location.hash = hash;
}

function currentRoute() {
  const h = (location.hash || '#/').replace(/^#/, '');
  const [path, qs] = h.split('?');
  const parts = path.split('/').filter(Boolean);
  return { path, parts, q: new URLSearchParams(qs || '') };
}

/* Univers visuel : déduit de la route et de l'état.
   public = acquisition · learn = apprentissage · exam = épreuve en cours */
function universeOf(r) {
  const p = '/' + r.parts.join('/');
  if (!p.startsWith('/app')) return 'public';
  const inExam = (S.exam && !S.exam.submitted) || (S.cert && S.cert.running) || !!S.simRun;
  return inExam ? 'exam' : 'learn';
}
function isFocus() { return (S.exam && !S.exam.submitted) || (S.cert && S.cert.running) || !!S.simRun; }

function render() {
  const r = currentRoute();
  document.documentElement.dataset.u = universeOf(r);
  const key = '/' + r.parts.join('/');
  let fn = ROUTES[key];
  if (!fn) {
    for (const p in ROUTES) {
      const a = p.split('/').filter(Boolean), b = r.parts;
      if (a.length !== b.length) continue;
      if (a.every((seg, i) => seg.startsWith(':') || seg === b[i])) { fn = ROUTES[p]; break; }
    }
  }
  const root = document.getElementById('root');
  root.innerHTML = fn ? fn(r) : notFound();
  bindViz(root);
  bindReveal(root);
  window.scrollTo(0, 0);
  document.querySelectorAll('[data-autofocus]').forEach(e => e.focus());
  S.sidebarOpen = false;
}

/* ---------------- Essai gratuit sans compte ----------------
   Le test est rattaché à un CONCOURS, pas à une filière : une porte peut
   contenir plusieurs concours ouverts aux référentiels différents.
   L'identifiant accepté est celui d'un concours ou celui d'une porte
   (auquel cas on retient le premier concours ouvert de la porte).
   ------------------------------------------------------------ */
function essaiFamily(id) {
  const direct = DATA.families.find(x => x.id === id && x.live);
  if (direct) return direct;
  const p = portal(id);
  if (!p) return null;
  return DATA.families.find(x => p.families.includes(x.id) && x.live) || null;
}
function portalOfFamily(f) { return DATA.portals.find(p => p.families.includes(f.id)); }
function liveSiblings(f) {
  const p = portalOfFamily(f);
  return p ? DATA.families.filter(x => p.families.includes(x.id) && x.live) : [f];
}

function startEssai(fid) {
  const f = DATA.families.find(x => x.id === fid);
  const pillars = progPillars(f.prog);
  const pool = progQuestions(f.prog);
  const quota = [4, 3, 3];
  const take = (arr, n) => {
    if (arr.length <= n) return arr;
    const step = Math.max(1, Math.floor(arr.length / n));
    return arr.filter((_, i) => i % step === 0).slice(0, n);
  };
  let ids = [];
  pillars.forEach((pl, i) => {
    const inPillar = pool.filter(q => comp(q.comp).pillar === pl.id).map(q => q.id);
    ids = ids.concat(take(inPillar, quota[i] || 3));
  });
  pool.forEach(q => { if (ids.length < 10 && !ids.includes(q.id)) ids.push(q.id); });
  S.essai = { fid, ids: ids.slice(0, 10), i: 0, answers: {}, done: false };
  navigate('#/essai/' + fid);
}

  const f = essaiFamily(r.parts[1]);

  const p = portalOfFamily(f);

          <b class="small" style="display:block;margin-top:7px">${t}</b><span class="xsmall muted">${d}</span></div>`).join('')}

  }

  if (e.done) return essaiResult(f);

  const q = DATA.questions.find(x => x.id === e.ids[e.i]);

      ${questionBlock(q, { answer: ans, onPick: `essaiPick('${q.id}',` })}
      <div class="row-between mt24">
        <button class="btn btn-ghost" ${e.i === 0 ? 'disabled' : ''} onclick="S.essai.i--;render()">Précédent</button>
        <button class="btn btn-primary" ${ans === undefined ? 'disabled' : ''} onclick="essaiNext()">
          ${e.i + 1 === e.ids.length ? 'Voir mon résultat' : 'Suivant'}</button>
      </div>
      <p class="xsmall muted center mt16">Les corrections ne sont pas affichées pendant le test : elles fausseraient la mesure. Vous les verrez à la fin.</p>
    </div>`, 'home');
});

function essaiPick(qid, k) { S.essai.answers[qid] = k; render(); }
function essaiNext() {
  if (S.essai.i + 1 >= S.essai.ids.length) S.essai.done = true; else S.essai.i++;
  render();
}

function essaiResult(f) {
  const e = S.essai;
  const p = portalOfFamily(f);
  const ok = e.ids.filter(id => e.answers[id] === DATA.questions.find(q => q.id === id).correct);
  const score = Math.round((ok.length / e.ids.length) * 100);
  const byC = {};
  e.ids.forEach(id => {
    const q = DATA.questions.find(x => x.id === id);
    byC[q.comp] = byC[q.comp] || { ok: 0, n: 0 };
    byC[q.comp].n++; if (ok.includes(id)) byC[q.comp].ok++;
  });
  const rows = Object.entries(byC).map(([c, v]) => ({ c, pct: Math.round(v.ok / v.n * 100), n: v.n })).sort((a, b) => a.pct - b.pct);
  const weakest = rows[0];
  const firstWrong = e.ids.find(id => !ok.includes(id)) || e.ids[0];

  const R = 58, circ = 2 * Math.PI * R;
  return shellPublic(`<div class="wrap-narrow" style="padding:34px 20px 0">
    <div class="scorehero">
      <div class="ring">
        <svg viewBox="0 0 132 132" width="132" height="132" role="img" aria-label="Score ${score} %">
          <circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--surface-3)" stroke-width="11"/>
          <circle cx="66" cy="66" r="${R}" fill="none" stroke="${score >= 70 ? 'var(--good)' : score >= 50 ? 'var(--warn)' : 'var(--critical)'}"
            stroke-width="11" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ * (1 - score / 100)}"
            transform="rotate(-90 66 66)"/>
          <text x="66" y="72" text-anchor="middle" font-size="30" font-weight="750" fill="var(--ink)">${score}%</text>
        </svg>
      </div>
      <h1 style="font-size:clamp(1.5rem,3vw,2rem)">${ok.length} bonnes réponses sur ${e.ids.length}</h1>
      <p class="muted" style="max-width:50ch;margin:10px auto 0">Dix questions ne suffisent pas à établir un profil fiable. Ce résultat indique une tendance, pas un niveau définitif — et nous préférons vous le dire.</p>
    </div>

    <div class="card">
      <h3 style="font-size:1rem">Vos compétences sur ce test</h3>
      <div class="vsub small muted" style="margin-bottom:14px">Classées de la plus fragile à la plus solide</div>
      ${barsChart(rows.map(x => ({ label: comp(x.c).short, value: x.pct, color: `var(--series-${pillarOf(x.c).serie})`, tip: `${x.pct} % sur ${x.n} question(s)` })), { labelW: 190, unit: ' %' })}
      <div class="legend">${progPillars(f.prog).map(pl => `<span><i style="background:var(--series-${pl.serie})"></i>${esc(pl.name)}</span>`).join('')}</div>
    </div>

    <div class="reco mt24">
      <div class="icon">◎</div>
      <div style="flex:1">
        <h4>Votre point le plus faible : ${esc(comp(weakest.c).name)}</h4>
        <p class="small dim" style="margin:0">${weakest.pct} % de réussite sur ce test. C'est là qu'un effort produirait le gain le plus rapide.</p>
        <div class="why"><b>Pourquoi cette recommandation ?</b> Elle applique une règle simple et vérifiable : le score le plus bas parmi les compétences ayant le plus de poids dans l'épreuve. Aucun modèle opaque n'intervient.</div>
      </div>
    </div>

    <h2 style="font-size:1.2rem;margin:36px 0 8px">Une de vos erreurs, corrigée</h2>
    <p class="small muted" style="margin-bottom:14px">Voici ce que vous obtenez sur chaque question. Pas seulement la bonne réponse : la raison pour laquelle chacune des autres est fausse.</p>
    ${questionBlock(DATA.questions.find(q => q.id === firstWrong), { answer: e.answers[firstWrong], reveal: true })}

    <div class="gate mt32">
      <h3 style="font-size:1.2rem">Conservez ce résultat</h3>
      <p class="dim" style="max-width:52ch;margin:10px auto 18px">Le compte gratuit garde votre profil, ouvre le test de niveau complet et vous donne dix questions par jour avec leurs corrections. Sans carte bancaire.</p>
      <div class="row" style="justify-content:center">
        <a class="btn btn-primary btn-lg" href="#/app/onboarding">Créer mon compte gratuit</a>
        <a class="btn btn-ghost btn-lg" href="#/p/${p.id}#tarifs">Voir les offres</a>
      </div>
      <div class="xsmall muted mt16">Déjà inscrit ? <a href="#/app" style="color:var(--brand-700)">Se connecter</a></div>
    </div>

    <div class="row center mt24" style="justify-content:center;padding-bottom:10px">
      <button class="btn btn-quiet btn-sm" onclick="S.essai=null;render()">Refaire le test</button>
    </div>
  </div>`, 'home');
}

/* ---------------- Bloc question réutilisable ----------------
   opts : { answer, reveal, limited, onPick, flagged, index, total }
   ------------------------------------------------------------ */
function questionBlock(q, opts) {
  opts = opts || {};
  const ar = isRTL() && DATA.questionsAr[q.id];
  const tr = ar ? DATA.questionsAr[q.id] : null;
  const c = comp(q.comp);
  const pick = opts.onPick || `demoAnswer('${q.id}',`;
  const reveal = opts.reveal;

  const choices = q.choices.map(ch => {
    const label = tr ? tr.choices[ch.k] : ch.t;
    let cls = '', end = '';
    if (reveal) {
      if (ch.k === q.correct) { cls = 'correct'; end = `<span class="tagend">${esc(T('correct'))}</span>`; }
      else if (ch.k === opts.answer) { cls = 'wrong'; end = `<span class="tagend">${esc(T('yourAnswer'))}</span>`; }
      else cls = 'missed';
    } else if (opts.answer === ch.k) cls = 'sel';
    return `<button class="choice ${cls}" ${reveal ? 'disabled' : ''} onclick="${pick}'${ch.k}')">
      <span class="k">${ch.k}</span><span class="t">${esc(label)}</span>${end}</button>`;
  }).join('');

  const meta = `<div class="qmeta">
    ${badge(c.short, 'brand')}
    ${badge(q.cog)}
    ${diffDots(q.diff)}
    <span class="spacer" style="flex:1"></span>
    ${opts.index ? `<span class="xsmall muted mono"><bdi>${opts.index} / ${opts.total}</bdi></span>` : ''}
    ${opts.onFlag ? `<button class="iconbtn" style="width:30px;height:30px" onclick="${opts.onFlag}" title="Marquer pour y revenir">${icon('star', 16)}</button>` : ''}
  </div>`;

  let rationale = '';
  if (reveal) {
    if (opts.limited && !isPremium()) {
      rationale = `<div class="rationale">
        <header>${icon('eye', 17)} ${esc(T('rat_partial'))}</header>
        <div class="body">
          <div class="rat-item"><div class="rat-head"><span class="rat-key ok">${q.correct}</span> ${esc(T('rat_ok'))}</div>
            <p>${esc((tr ? tr.rationales : q.rationales)[q.correct])}</p></div>
          <div class="paywall" style="margin:14px 0 4px;padding:20px">
            <b>Il manque l'essentiel : pourquoi les autres options sont fausses.</b>
            <p class="small dim" style="margin:8px auto 14px;max-width:44ch">C'est là que se joue la différence entre reconnaître une bonne réponse et comprendre son erreur. Le premium débloque la justification de chaque distracteur, le piège fréquent et la source.</p>
            <a class="btn btn-primary btn-sm" href="#/tarifs">Voir les offres</a>
          </div>
        </div></div>`;
    } else {
      const rats = tr ? tr.rationales : q.rationales;
      rationale = `<div class="rationale">
        <header>${icon('check', 17)} ${esc(T('rat_header'))}</header>
        <div class="body">
          ${q.choices.map(ch => `<div class="rat-item">
            <div class="rat-head"><span class="rat-key ${ch.k === q.correct ? 'ok' : 'no'}">${ch.k}</span>
              ${esc(ch.k === q.correct ? T('rat_ok') : T('rat_no'))}
              ${ch.k === opts.answer && ch.k !== q.correct ? badge(T('rat_yours'), 'crit') : ''}</div>
            <p>${md(rats[ch.k])}</p></div>`).join('')}
          <div class="rat-trap"><span>${icon('flag', 16)}</span><div><b>${esc(T('rat_trap'))}</b> ${md(tr ? tr.trap : q.trap)}</div></div>
          <div class="rat-source">
            <span><b>${esc(T('source'))} :</b> <bdi>${esc(q.source.ref)}</bdi></span>
            <span><b>${esc(T('rat_loc'))} :</b> <bdi>${esc(q.source.loc)}</bdi></span>
            <span><b>${esc(T('competency'))} :</b> ${esc(c.name)}</span>
            <span><b>${esc(T('cognitive'))} :</b> ${esc(q.cog)}</span>
            <span><b>${esc(T('rat_version'))} :</b> <bdi>${esc(q.source.date)}</bdi></span>
          </div>
          <div class="row-between mt16">
            <div class="small muted"><bdi>${esc(T('lbl_rate')
              .replace('{p}', Math.round(q.stats.correct * 100))
              .replace('{n}', q.stats.seen.toLocaleString(S.lang === 'ar' ? 'ar-MA' : 'fr-FR')))}</bdi></div>
            <div class="row" style="gap:6px">
              <button class="btn btn-sm btn-quiet" onclick="addToBook('${q.id}')">${icon('bookmark', 15)} ${esc(T('act_book'))}</button>
              <button class="btn btn-sm btn-quiet" onclick="reportItem('${q.id}')">${icon('flag', 15)} ${esc(T('act_report'))}</button>
            </div>
          </div>
          <details style="margin-top:12px"><summary class="small muted" style="cursor:pointer">${esc(T('act_distrib'))}</summary>
            <div style="margin-top:11px">${distractorBars(q)}</div>
            <p class="xsmall muted" style="margin-top:9px">Un distracteur choisi par moins de 3 % des candidats est considéré comme non discriminant et signalé à l'équipe éditoriale.</p>
          </details>
        </div></div>`;
    }
  }

  return `<div class="qcard">
    ${meta}
    <div class="qstem">${q.ctx ? `<span class="ctx">${esc(q.ctx)}</span>` : ''}${esc(tr ? tr.stem : q.stem)}</div>
    <div class="choices">${choices}</div>
    ${rationale}
  </div>`;
}

        ? `<button class="btn btn-primary" onclick="S.onb.step++;render()">${esc(T('next'))}</button>`
        : `<button class="btn btn-primary btn-lg" onclick="startDiag()">Lancer le diagnostic</button>`}
    </div></div>`, 'diag');
});

function startDiag() {
  S.diag = { i: 0, answers: {}, ids: DATA.questions.map(q => q.id).slice(0, 12), started: true, done: false };
  navigate('#/app/diagnostic');
}

route('/app/diagnostic', () => {
  const d = S.diag;
  if (!d) return shellApp(`
    ${pagehead('Diagnostic initial', "Le point de départ : identifier précisément où vous en êtes, compétence par compétence.")}
    <div class="grid" style="grid-template-columns:1.5fr 1fr;gap:24px">

          <li><b>Sans chronomètre contraignant</b> — le temps par question est mesuré mais ne pénalise pas</li>

        </ul>

    </div>`, 'diag');

  const prog = (d.i / d.ids.length) * 100;
  return shellApp(`
    <div class="row-between" style="margin-bottom:12px">
      <div><b>Diagnostic initial</b><div class="xsmall muted">Question ${d.i + 1} sur ${d.ids.length} · ${esc(comp(q.comp).name)}</div></div>

});

function diagPick(qid, k) { S.diag.answers[qid] = k; render(); }
function diagNext() {
  if (S.diag.i + 1 >= S.diag.ids.length) { S.diag.done = true; }
  else S.diag.i++;
  render();
}

function diagResult() {
  const d = S.diag;
  const byComp = {};
  d.ids.forEach(id => {
    const q = DATA.questions.find(x => x.id === id);
    const ok = d.answers[id] === q.correct;
    byComp[q.comp] = byComp[q.comp] || { ok: 0, n: 0 };
    byComp[q.comp].n++; if (ok) byComp[q.comp].ok++;
  });
  const rows = Object.entries(byComp).map(([c, v]) => ({
    comp: c, score: Math.round((v.ok / v.n) * 100), evidence: Math.min(4, Math.max(1, Math.round(v.n / 1.5))),
    answers: v.n, trend: 0, updated: "à l'instant"
  })).sort((a, b) => a.score - b.score);
  const total = d.ids.filter(id => d.answers[id] === DATA.questions.find(q => q.id === id).correct).length;
  const weakest = rows[0];
  const pillarAgg = progPillars('crmef').map(p => {
    const rs = rows.filter(r => comp(r.comp).pillar === p.id);
    return { label: p.name, short: p.name.split(' ')[0], score: rs.length ? Math.round(rs.reduce((a, b) => a + b.score, 0) / rs.length) : 0, color: `var(--series-${p.serie})` };
  });

  return shellApp(`
    ${pagehead('Votre profil de maîtrise', `Établi sur ${d.ids.length} questions. Ce profil est un point de départ : il se précisera à mesure que vous vous entraînerez.`)}
    <div class="grid g4" style="margin-bottom:24px">
      <div class="stat"><div class="k">Réponses justes</div><div class="v mono">${total}<span style="font-size:1rem;color:var(--ink-3)">/${d.ids.length}</span></div></div>
      <div class="stat"><div class="k">Compétences évaluées</div><div class="v mono">${rows.length}</div></div>
      <div class="stat"><div class="k">Point le plus faible</div><div class="v" style="font-size:1.05rem;line-height:1.4;padding-top:6px">${esc(comp(weakest.comp).short)}</div><div class="s">${weakest.score}/100</div></div>
      <div class="stat"><div class="k">Niveau d'évidence</div><div class="v" style="font-size:1.05rem;line-height:1.4;padding-top:6px">Faible</div><div class="s">12 réponses seulement</div></div>
    </div>

    <div class="disclaimer" style="margin-bottom:24px"><span>ℹ️</span><div>
      <b>Ce que ce profil ne dit pas.</b> Il ne contient aucune probabilité de réussite au concours. Un score calculé sur douze réponses a une marge d'erreur importante, que nous affichons plutôt que de la masquer. Le niveau d'évidence augmentera avec votre entraînement.</div></div>

    <div class="grid" style="grid-template-columns:1fr 1fr;gap:20px">
      <div class="viz"><h3>Vue par pilier</h3><div class="vsub">Moyenne des compétences évaluées dans chaque pilier</div>
        ${radarChart(pillarAgg, { size: 290 })}
        <div class="legend">${progPillars('crmef').map(p => `<span><i style="background:var(--series-${p.serie})"></i>${esc(p.name)}</span>`).join('')}</div></div>
      <div class="viz"><h3>Détail par compétence</h3><div class="vsub">Classé du plus fragile au plus solide</div>
        ${barsChart(rows.map(r => ({ label: comp(r.comp).short, value: r.score, color: `var(--series-${pillarOf(r.comp).serie})`, tip: `${r.score}/100 sur ${r.answers} questions` })), { labelW: 150, aria: 'Score par compétence' })}
        <p class="xsmall muted mt16">Étiquettes de valeur affichées directement, la couleur ne portant jamais seule l'information.</p></div>
    </div>

    <h2 style="font-size:1.25rem;margin:32px 0 14px">Votre première recommandation</h2>
    <div class="reco">
      <div class="icon">${icon('target', 20)}</div>
      <div style="flex:1">
        <h4>Commencer par « ${esc(comp(weakest.comp).name)} »</h4>
        <p class="small dim" style="margin:0">Une série de 10 questions ciblées, puis une question ouverte pour vérifier que vous savez rédiger l'analyse et pas seulement la reconnaître.</p>
        <div class="why"><b>${esc(T('why'))}</b> Vous avez obtenu ${weakest.score}/100 sur cette compétence, votre score le plus bas. Elle représente par ailleurs une part importante du blueprint de l'épreuve écrite. C'est donc le point où un effort produit le gain le plus élevé. <span class="muted">Règle appliquée : priorité au couple score faible × poids élevé.</span></div>
        <div class="row mt16"><a class="btn btn-primary btn-sm" href="#/app/entrainement">Lancer la série ciblée</a>
        <a class="btn btn-ghost btn-sm" href="#/app/coach">En parler au coach</a></div>
      </div>
    </div>

    <h2 style="font-size:1.25rem;margin:32px 0 14px">Revoir vos réponses</h2>
    <div class="col" style="gap:12px">
      ${d.ids.map(id => {
        const q = DATA.questions.find(x => x.id === id);
        const ok = d.answers[id] === q.correct;
        return `<details class="card card-pad-sm">
          <summary style="cursor:pointer;display:flex;gap:10px;align-items:center">
            <span class="rat-key ${ok ? 'ok' : 'no'}" style="background:${ok ? 'var(--good)' : 'var(--critical)'};color:#fff">${ok ? icon('check',13) : icon('x',13)}</span>
            <span style="flex:1;font-size:.9rem;font-weight:600">${esc(q.stem.slice(0, 84))}…</span>
            ${badge(comp(q.comp).short)}</summary>
          <div style="margin-top:14px">${questionBlock(q, { answer: d.answers[id], reveal: true, limited: true })}</div>
        </details>`;
      }).join('')}
    </div>`, 'diag');
}

function toggleComp(id) {
  const c = S.serieCfg.comps;
  const i = c.indexOf(id); i >= 0 ? c.splice(i, 1) : c.push(id);
  render();
}

function startSerie() {
  const cfg = S.serieCfg;
  let pool = DATA.questions.slice();
  if (cfg.mode === 'comp' && cfg.comps.length) pool = pool.filter(q => cfg.comps.includes(q.comp));
  if (cfg.mode === 'errors') pool = pool.filter(q => DATA.profile.errorBook.some(e => e.qid === q.id));
  if (cfg.mode === 'reco') pool = pool.slice().sort((a, b) => masteryOf(a.comp).score - masteryOf(b.comp).score);
  if (cfg.diff === 'hard') pool = pool.filter(q => q.diff >= 3);
  if (cfg.diff === 'prog') pool = pool.slice().sort((a, b) => a.diff - b.diff);
  if (!pool.length) pool = DATA.questions.slice();
  const ids = [];
  for (let i = 0; ids.length < Math.min(cfg.size, 26); i++) ids.push(pool[i % pool.length].id);
  S.serie = { ids: [...new Set(ids)], i: 0, answers: {}, revealed: {}, finished: false, t0: Date.now(), times: {} };
  render();
}

function serieRun() {
  const s = S.serie;
  const q = DATA.questions.find(x => x.id === s.ids[s.i]);
  const ans = s.answers[q.id];
  const rev = s.revealed[q.id];
  const locked = !isPremium() && s.i >= 3;

  if (locked) return shellApp(`
    ${pagehead('Entraînement ciblé')}
    ${paywall('La série ciblée complète')}
    <div class="card card-flat mt24"><b class="small">Où vous en étiez</b>
      <p class="small dim" style="margin:6px 0 0">Vous avez traité 3 questions sur ${s.ids.length}. Le compte gratuit permet de découvrir le format ; le premium ouvre la série entière, les justifications complètes et le carnet d'erreurs.</p></div>`, 'train');

  return shellApp(`
    <div class="exambar">
      <b class="small">${esc(T('lbl_serie'))}</b>
      <span class="badge badge-brand">${esc(comp(q.comp).short)}</span>
      <span class="spacer" style="flex:1"></span>
      <span class="saveind"><span class="dot"></span>${esc(T('saved'))}</span>
      <span class="small mono muted"><bdi>${s.i + 1} / ${s.ids.length}</bdi></span>
      <button class="btn btn-sm btn-quiet" onclick="quitSerie()">${esc(T('lbl_quit'))}</button>
    </div>
    <div class="bar bar-thin" style="margin-bottom:20px"><span style="width:${(s.i / s.ids.length) * 100}%"></span></div>

    ${questionBlock(q, { answer: ans, reveal: rev, onPick: `seriePick('${q.id}',`, index: s.i + 1, total: s.ids.length })}

    <div class="row-between mt24">
      <button class="btn btn-ghost" ${s.i === 0 ? 'disabled' : ''} onclick="S.serie.i--;render()">${esc(T('prev'))}</button>
      <div class="row">
        ${!rev
          ? `<button class="btn btn-primary" ${ans === undefined ? 'disabled' : ''} onclick="S.serie.revealed['${q.id}']=true;render()">${esc(T('validate'))}</button>`
          : `<button class="btn btn-primary" onclick="serieNext()">${s.i + 1 === s.ids.length ? 'Voir le bilan' : esc(T('next'))}</button>`}
      </div>
    </div>`, 'train');
}

function seriePick(qid, k) { if (S.serie.revealed[qid]) return; S.serie.answers[qid] = k; render(); }
function serieNext() { if (S.serie.i + 1 >= S.serie.ids.length) S.serie.finished = true; else S.serie.i++; render(); }
function quitSerie() {
  modal(`<h3>Quitter la série ?</h3><p class="small dim">Votre progression est enregistrée. Vous pourrez la reprendre depuis n'importe quel appareil.</p>
    <div class="row" style="justify-content:flex-end"><button class="btn btn-quiet" onclick="closeModal()">Continuer</button>
    <button class="btn btn-primary" onclick="S.serie=null;closeModal();render()">Quitter</button></div>`);
}

function serieReport() {
  const s = S.serie;
  const ok = s.ids.filter(id => s.answers[id] === DATA.questions.find(q => q.id === id).correct);
  const ko = s.ids.filter(id => !ok.includes(id));
  const byComp = {};
  s.ids.forEach(id => {
    const q = DATA.questions.find(x => x.id === id);
    byComp[q.comp] = byComp[q.comp] || { ok: 0, n: 0 };
    byComp[q.comp].n++; if (ok.includes(id)) byComp[q.comp].ok++;

/* ---------------- Simulateur : passation ---------------- */
function startExam(bpId) {
  const bp = DATA.blueprints.find(b => b.id === bpId);
  const ids = shuffleSeeded(DATA.questions.map(q => q.id), 42).slice(0, Math.min(bp.questionCount, DATA.questions.length));
  S.exam = { bp: bpId, ids, i: 0, answers: {}, flags: {}, left: bp.duration * 60, submitted: false, t0: Date.now(), saving: false };
  startTimer();
  render();
}

let EXAM_TIMER = null;
function startTimer() {
  clearInterval(EXAM_TIMER);
  EXAM_TIMER = setInterval(() => {
    if (!S.exam || S.exam.submitted) { clearInterval(EXAM_TIMER); return; }
    S.exam.left--;
    const el = document.getElementById('timer');
    if (el) {
      const t = el.querySelector('.tv'); if (t) t.textContent = mmss(S.exam.left);
      el.className = 'timer' + (S.exam.left < 300 ? ' low' : '');
    }
    if (S.exam.left <= 0) { clearInterval(EXAM_TIMER); submitExam(true); }
  }, 1000);
}

function examRun() {
  const e = S.exam, bp = DATA.blueprints.find(b => b.id === e.bp);
  const q = DATA.questions.find(x => x.id === e.ids[e.i]);
  const answered = Object.keys(e.answers).length;
  return shellApp(`
    <div class="exambar">
      <button class="btn btn-sm btn-quiet exitfocus" onclick="confirmQuitExam()">${icon('arrow', 15, 'ic-flip')} Quitter</button>
      <b class="small">${esc(bp.name)}</b>
      <span id="timer" class="timer ${e.left < 300 ? 'low' : ''}">${icon('timer',16)}<span class="tv">${mmss(e.left)}</span></span>
      <span class="saveind ${e.saving ? 'saving' : ''}"><span class="dot"></span>${esc(e.saving ? T('saving') : T('saved'))}</span>
      <span class="spacer" style="flex:1"></span>
      <span class="small muted mono"><bdi>${answered} / ${e.ids.length}</bdi> ${esc(T("lbl_answered"))}</span>
      <button class="btn btn-sm btn-primary" onclick="confirmSubmit()">${esc(T('submit'))}</button>
    </div>

    <div class="grid" style="grid-template-columns:1fr 210px;gap:20px">
      <div>
        ${questionBlock(q, {
          answer: e.answers[q.id], onPick: `examPick('${q.id}',`,
          index: e.i + 1, total: e.ids.length,
          onFlag: `examFlag('${q.id}')`, flagged: e.flags[q.id]
        })}
        <div class="row-between mt24">
          <button class="btn btn-ghost" ${e.i === 0 ? 'disabled' : ''} onclick="S.exam.i--;render()">${esc(T('prev'))}</button>
          <div class="row">
            <button class="btn btn-quiet" onclick="examFlag('${q.id}')">${icon('star', 16)} ${e.flags[q.id] ? 'Marquée' : 'Marquer'}</button>
            <button class="btn btn-primary" ${e.i + 1 >= e.ids.length ? 'disabled' : ''} onclick="S.exam.i++;render()">${esc(T('next'))}</button>
          </div>
        </div>
        <p class="xsmall muted center mt16">Aucune correction n'est affichée pendant l'épreuve. Vos réponses sont enregistrées à chaque clic et survivent à une coupure réseau.</p>
      </div>

      <div>
        <div class="card card-pad-sm" style="position:sticky;top:132px">
          <h3 style="font-size:.88rem;margin-bottom:10px">Navigation</h3>
          <div class="qnav">${e.ids.map((id, i) => `<button class="${e.answers[id] ? 'answered' : ''} ${e.flags[id] ? 'flagged' : ''} ${i === e.i ? 'cur' : ''}"
            onclick="S.exam.i=${i};render()" aria-label="Question ${i + 1}">${i + 1}</button>`).join('')}</div>
          <div class="divider" style="margin:14px 0"></div>
          <div class="col xsmall muted" style="gap:5px">
            <span><i style="display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--brand-100);border:1px solid var(--brand-300);vertical-align:-1px"></i> répondue</span>
            <span><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--safran-600);vertical-align:0"></i> marquée</span>
          </div>
        </div>
      </div>
    </div>`, 'sim');
}

function confirmQuitExam() {
  modal(`<h3>Quitter l'épreuve ?</h3>
    <p class="small dim">Le chronomètre continue de tourner. Vos réponses sont conservées et vous pourrez reprendre là où vous vous êtes arrêté.</p>
    <div class="row mt16" style="justify-content:flex-end"><button class="btn btn-quiet" onclick="closeModal()">Rester</button>
    <button class="btn btn-primary" onclick="closeModal();navigate('#/app')">Quitter</button></div>`);
}

function examPick(qid, k) {
  S.exam.answers[qid] = k; S.exam.saving = true; render();
  setTimeout(() => { if (S.exam) { S.exam.saving = false; const el = document.querySelector('.saveind'); if (el) { el.classList.remove('saving'); el.lastChild.textContent = T('saved'); } } }, 550);
}
function examFlag(qid) { S.exam.flags[qid] = !S.exam.flags[qid]; render(); }

function confirmSubmit() {
  const e = S.exam, left = e.ids.length - Object.keys(e.answers).length;
  modal(`<h3>Soumettre l'examen ?</h3>
    <p class="small dim">Après soumission, l'épreuve est verrouillée et le score calculé. ${left ? `<b>${left} question${left > 1 ? 's' : ''} sans réponse</b> — elles compteront pour zéro.` : 'Toutes les questions ont une réponse.'}</p>
    <div class="card card-flat card-pad-sm"><div class="xsmall"><b>Temps restant :</b> ${mmss(e.left)}</div>
      <div class="xsmall"><b>Questions marquées :</b> ${Object.values(e.flags).filter(Boolean).length}</div></div>
    <div class="row mt16" style="justify-content:flex-end"><button class="btn btn-quiet" onclick="closeModal()">Continuer l'épreuve</button>
    <button class="btn btn-primary" onclick="closeModal();submitExam()">Soumettre définitivement</button></div>`);
}

function submitExam(auto) {
  clearInterval(EXAM_TIMER);
  S.exam.submitted = true;
  S.exam.duration = Math.round((Date.now() - S.exam.t0) / 1000);
  render();
  if (auto) toast('Temps écoulé — épreuve soumise automatiquement');
}

/* ---------------- Simulateur : rapport ---------------- */
function examReport() {
  const e = S.exam, bp = DATA.blueprints.find(b => b.id === e.bp);
  const ok = e.ids.filter(id => e.answers[id] === DATA.questions.find(q => q.id === id).correct);
  const score = ok.length;
  const bySec = bp.sections.map(s => {
    const ids = e.ids.filter(id => s.comps.includes(DATA.questions.find(q => q.id === id).comp));
    const good = ids.filter(id => ok.includes(id)).length;
    return { name: s.name, n: ids.length, ok: good, pct: ids.length ? Math.round(good / ids.length * 100) : 0 };
  }).filter(s => s.n);
  const byComp = {};
  e.ids.forEach(id => { const q = DATA.questions.find(x => x.id === id); byComp[q.comp] = byComp[q.comp] || { ok: 0, n: 0 }; byComp[q.comp].n++; if (ok.includes(id)) byComp[q.comp].ok++; });
  const weak = Object.entries(byComp).map(([c, v]) => ({ c, pct: Math.round(v.ok / v.n * 100), n: v.n })).sort((a, b) => a.pct - b.pct);

  return shellApp(`
    ${pagehead("Rapport d'examen", `${esc(bp.name)} — soumis le 4 août 2026`)}
    <div class="grid g4" style="margin-bottom:24px">
      <div class="stat"><div class="k">Score</div><div class="v mono">${score}<span style="font-size:1rem;color:var(--ink-3)">/${e.ids.length}</span></div>
        <div class="s">${score >= bp.pass ? `<span class="delta-up">au-dessus du seuil indicatif</span>` : `<span class="delta-down">sous le seuil indicatif (${bp.pass})</span>`}</div></div>
      <div class="stat"><div class="k">Temps utilisé</div><div class="v mono">${Math.floor(e.duration / 60)}<span style="font-size:1rem"> min</span></div><div class="s">sur ${bp.duration} min autorisées</div></div>
      <div class="stat"><div class="k">Sans réponse</div><div class="v mono">${e.ids.length - Object.keys(e.answers).length}</div></div>
      <div class="stat"><div class="k">Marquées</div><div class="v mono">${Object.values(e.flags).filter(Boolean).length}</div><div class="s">à revoir en priorité</div></div>
    </div>

    <div class="disclaimer info" style="margin-bottom:24px"><span>${icon('bulb', 17)}</span><div>
      <b>Ce rapport ne prédit rien.</b> Le seuil indiqué est un repère interne, pas un seuil officiel du concours. Nous n'affichons aucune probabilité de réussite : elle serait mal calibrée tant que nous n'avons pas relié nos résultats à ceux des sessions réelles.</div></div>

    <div class="grid" style="grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px">
      <div class="viz"><h3>Résultat par section</h3><div class="vsub">Structure définie par le blueprint ${esc(bp.version)}</div>
        ${barsChart(bySec.map((s, i) => ({ label: s.name, value: s.pct, color: `var(--series-${i + 1})`, tip: `${s.ok}/${s.n} questions` })), { labelW: 160, unit: ' %' })}
        <div class="legend">${bySec.map((s, i) => `<span><i style="background:var(--series-${i + 1})"></i>${esc(s.name)} — ${s.ok}/${s.n}</span>`).join('')}</div></div>
      <div class="viz"><h3>Compétences les plus fragiles</h3><div class="vsub">Sur cet examen uniquement</div>
        ${barsChart(weak.slice(0, 6).map(w => ({ label: comp(w.c).short, value: w.pct, color: `var(--series-${pillarOf(w.c).serie})`, tip: `${w.pct} % sur ${w.n} questions` })), { labelW: 150, unit: ' %' })}
        <p class="xsmall muted mt16">Une compétence évaluée sur moins de trois questions est signalée comme peu fiable et n'entraîne pas de recommandation.</p></div>
    </div>

    <h2 style="font-size:1.2rem;margin-bottom:12px">Votre plan de révision</h2>
    <div class="col" style="gap:12px;margin-bottom:28px">
      ${weak.slice(0, 3).map((w, i) => `<div class="reco">
        <div class="icon">${i + 1}</div>
        <div style="flex:1">
          <h4>${esc(comp(w.c).name)}</h4>
          <p class="small dim" style="margin:0">${w.pct} % de réussite sur cet examen. Série ciblée de 10 questions, puis relecture des justifications de vos choix erronés.</p>
          <div class="why"><b>${esc(T('why'))}</b> Cette compétence combine le score le plus bas de votre examen et une présence de ${w.n} question${w.n > 1 ? 's' : ''} dans le blueprint. La règle appliquée classe par score croissant, à poids égal dans l'épreuve.</div>
          <div class="row mt16"><a class="btn btn-sm btn-primary" href="#/app/entrainement">Lancer la série</a></div>
        </div></div>`).join('')}
    </div>

    <h2 style="font-size:1.2rem;margin-bottom:12px">Détail question par question</h2>
    <div class="card" style="padding:0;overflow-x:auto">
      <table class="table">
        <thead><tr><th>#</th><th>Compétence</th><th>Niveau cognitif</th><th class="num">Votre réponse</th><th class="num">Attendue</th><th></th></tr></thead>
        <tbody>${e.ids.map((id, i) => {
          const q = DATA.questions.find(x => x.id === id);
          const good = ok.includes(id);
          const a = e.answers[id];
          return `<tr><td class="mono small">${i + 1}</td>
            <td class="small">${esc(comp(q.comp).short)}</td>
            <td class="small muted">${esc(q.cog)}</td>
            <td class="num"><span class="badge ${good ? 'badge-good' : a ? 'badge-crit' : 'badge-outline'}">${a || '—'}</span></td>
            <td class="num"><span class="badge badge-good">${q.correct}</span></td>
            <td class="num"><button class="btn btn-sm btn-quiet" onclick="showQuestion('${id}')">Voir</button></td></tr>`;
        }).join('')}</tbody>
      </table>
    </div>
    <div class="row mt24"><button class="btn btn-primary" onclick="S.exam=null;render()">Retour aux simulateurs</button>
      <button class="btn btn-ghost" onclick="toast('Export PDF — non inclus dans le prototype')">Exporter en PDF</button></div>`, 'sim');
}

function onOpenInput(id) {
  const v = document.getElementById('oa').value;

function submitOpen(id) {
  const o = DATA.openQuestions.find(x => x.id === id);
  if (!o.scored) { toast("Cette question n'a pas d'évaluation préparée dans le prototype — essayez la première"); return; }

  setTimeout(() => { closeModal(); S.openAnswer[id].submitted = true; render(); }, 1700);

    ${pagehead("Évaluation de votre copie", esc(o.title))}
    <div class="disclaimer" style="margin-bottom:22px"><span>${icon('bulb', 17)}</span><div>
      <b>Cette copie a été évaluée par une machine.</b> L'appréciation ci-dessous applique la grille critère par critère. Elle ne prétend pas reproduire le jugement d'un jury de concours, et vous pouvez la contester : chaque critère porte un bouton de signalement.</div></div>

    <div class="grid" style="grid-template-columns:1fr 1.6fr;gap:20px">
      <div>
        <div class="card center">

          <div class="small strong">${p >= 70 ? 'Niveau attendu atteint' : p >= 50 ? 'Proche du niveau attendu' : 'En deçà du niveau attendu'}</div>
          <div class="xsmall muted mt8">${p} % — seuil indicatif de validation : 70 %</div>
        </div>
        <div class="card mt16">
          <h3 style="font-size:.92rem;margin-bottom:10px">Répartition par critère</h3>
          ${barsChart(o.scored.map(s => {
            const r = o.rubric.find(x => x.id === s.id);
            return { label: r.name, value: Math.round(s.score / r.max * 100), color: 'var(--series-1)', tip: `${s.score} / ${r.max}` };
          }), { labelW: 200, unit: ' %' })}
        </div>
      </div>

      <div>
        <div class="card" style="margin-bottom:16px">
          <div class="row-between" style="margin-bottom:10px"><h3 style="font-size:.95rem">Votre copie</h3>
            <span class="xsmall muted">${S.openAnswer[o.id].text.trim().split(/\s+/).length} mots</span></div>
          <div class="card card-flat card-pad-sm" style="font-size:.92rem;line-height:1.75;white-space:pre-line">${esc(S.openAnswer[o.id].text)}</div>
        </div>

        <h3 style="font-size:1rem;margin-bottom:10px">Détail critère par critère</h3>
        <div class="rubric">
          ${o.scored.map(s => {
            const r = o.rubric.find(x => x.id === s.id);
            const ratio = s.score / r.max;
            return `<div class="r-row">
              <div class="r-top"><b>${esc(r.name)}</b>
                <span class="row" style="gap:10px"><span class="bar" style="width:80px"><span style="width:${ratio * 100}%;background:${ratio >= .7 ? 'var(--good)' : ratio >= .5 ? 'var(--warn)' : 'var(--critical)'}"></span></span>
                <span class="r-score">${s.score} / ${r.max}</span></span></div>
              <div class="r-comment">${esc(s.comment)}</div>
              <button class="btn btn-sm btn-quiet" style="margin-top:8px" onclick="toast('Contestation transmise à l\\'équipe pédagogique')">${icon('flag', 15)} Contester ce critère</button>

        <div class="card mt16" style="background:var(--brand-50);border-color:var(--brand-300)">
          <h3 style="font-size:.95rem">Ce qu'une copie de niveau attendu contient</h3>
          <p class="small dim" style="margin:8px 0 0">${esc(o.reference)}</p>
        </div>

        <div class="reco mt16">
          <div class="icon">${icon('arrow', 20, 'ic-flip')}</div><div style="flex:1">

function askCoach(t) { document.getElementById('ci').value = t; sendCoach(); }
function sendCoach() {
  const el = document.getElementById('ci');
  const t = el.value.trim(); if (!t) return;
  S.coach.push({ me: true, text: t }); el.value = '';
  S.coachTyping = true; render();
  const cc=document.getElementById('chat'); if(cc) cc.scrollTop=cc.scrollHeight;
  API.coach.reply(t).then(rep => {
    S.coachTyping = false;
    S.coach.push({ me: false, text: rep.text, actions: rep.actions || [] });
    render();
    const c = document.getElementById('chat'); if (c) c.scrollTop = c.scrollHeight;
  });
}

function qrSvg() {
  // Motif décoratif évoquant un QR — non fonctionnel dans le prototype
  const g = [];
  const seed = 7;
  let s = seed;
  for (let y = 0; y < 11; y++) for (let x = 0; x < 11; x++) {
    s = (s * 9301 + 49297) % 233280;
    const corner = (x < 3 && y < 3) || (x > 7 && y < 3) || (x < 3 && y > 7);
    const on = corner ? ((x === 0 || x === 2 || y === 0 || y === 2 || (x === 1 && y === 1)) ||
      (x > 7 && (x === 8 || x === 10 || y === 0 || y === 2 || (x === 9 && y === 1)))) : (s / 233280 > .5);
    if (on) g.push(`<rect x="${x * 7}" y="${y * 7}" width="7" height="7" fill="#14150f"/>`);
  }
  return `<svg viewBox="0 0 77 77" width="100%" height="100%" role="img" aria-label="Code de vérification">${g.join('')}</svg>`;
}

function startCert(id) {
  const c = DATA.certifications.find(x => x.id === id);
  modal(`<h3>Épreuve certifiante — ${esc(c.name)}</h3>

    <div class="disclaimer mt16"><span>${icon('flag', 17)}</span><div class="xsmall">L'attestation délivrée est un document privé, sans valeur officielle au regard des concours publics.</div></div>
    <div class="row mt16" style="justify-content:flex-end"><button class="btn btn-quiet" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="closeModal();S.cert={id:'${id}',running:true,i:0,answers:{},left:${c.duration * 60}};render()">Je commence</button></div>`);

function certExam() {
  const c = DATA.certifications.find(x => x.id === S.cert.id);
  const ids = DATA.questions.filter(q => comp(q.comp).pillar === c.pillar).map(q => q.id);
  const q = DATA.questions.find(x => x.id === ids[S.cert.i % ids.length]);
  const total = Math.min(c.questions, ids.length * 2);
  return shellApp(`
    <div class="exambar" style="border-color:var(--brand-600)">
      <b class="small">Épreuve certifiante</b>
      <span class="badge badge-brand">${esc(c.name)}</span>
      <span class="timer">${icon('timer',16)} ${mmss(S.cert.left)}</span>
      <span class="spacer" style="flex:1"></span>
      <span class="small mono muted">${S.cert.i + 1} / ${total}</span>
    </div>
    <div class="bar bar-thin" style="margin-bottom:20px"><span style="width:${S.cert.i / total * 100}%"></span></div>
    ${questionBlock(q, { answer: S.cert.answers[q.id], onPick: `certPick('${q.id}',`, index: S.cert.i + 1, total })}
    <div class="row-between mt24">
      <span class="small muted">Le retour en arrière est désactivé pendant l'épreuve certifiante.</span>
      <button class="btn btn-primary" ${S.cert.answers[q.id] === undefined ? 'disabled' : ''} onclick="certNext(${total})">
        ${S.cert.i + 1 >= total ? "Terminer l'épreuve" : esc(T('validate')) + ' et continuer'}</button>
    </div>`, 'cert');
}
function certPick(qid, k) { S.cert.answers[qid] = k; render(); }
function certNext(total) {
  if (S.cert.i + 1 >= total) {
    S.cert = null; toast('Épreuve terminée — résultat disponible sous 24 h dans la version réelle'); navigate('#/app/certification');
  } else { S.cert.i++; render(); }
}

function buildDiagPlan() {
  // Respecte autant que possible les poids officiels, sans jamais inventer de question
  const plan = [];
  DATA.crmef.epreuves.forEach(e => {
    ALL_SUBS().filter(s => s.ep === e.id).forEach(sub => {
      const qs = subQuestions(sub.id);
      if (qs.length) plan.push({ ep: e.id, sub: sub.id, qid: qs[0].id, weight: sub.weight });
    });
  });
  return plan.sort((a, b) => a.ep.localeCompare(b.ep) || b.weight - a.weight);
}

function startDiag2() {
  const s = st();

function diagNext2() {
  const s = st();
  if (s.diagnostic.i + 1 >= s.diagnostic.plan.length) { s.diagnostic.done = true; s.diagnostic.finished = nowTs(); }

  storeSave(); S.loop = null; render();
}

/* =========================================================================
   LA BOUCLE NAJAH — écran unique réutilisé par le diagnostic,
   l'apprentissage, l'entraînement et les rappels

function loopScreen(o) {
  const q = DATA.questions.find(x => x.id === o.qid);
  if (!q) return shellApp(`<div class="empty">${icon('compass', 34)}<p>Question introuvable.</p></div>`, 'parcours');
  const L = S.loop = S.loop || { step: 'answer', answer: null, cert: null, res: null, mirrorQ: null, mirrorAns: null };
  const sub = q.sub ? SUB(q.sub) : null;

  /* --- en-tête commun --- */
  const head = `<div class="exambar">
    <button class="btn btn-sm btn-quiet exitfocus" onclick="${o.onQuit}">${icon('arrow', 15, 'ic-flip')} Quitter</button>
    <b class="small">${esc(o.title)}</b>
    ${sub ? badge(sub.name, 'brand') : ''}
    <span class="spacer" style="flex:1"></span>
    <span class="saveind"><span class="dot"></span>Enregistré</span>
    ${o.total ? `<span class="small muted mono"><bdi>${o.index} / ${o.total}</bdi></span>` : ''}
  </div>
  ${o.total ? `<div class="bar bar-thin" style="margin-bottom:18px"><span style="width:${((o.index - 1) / o.total) * 100}%"></span></div>` : ''}`;

  /* --- étape 1 : répondre --- */
  if (L.step === 'answer') {
    return shellApp(`${head}
      ${questionBlock(q, { answer: L.answer, onPick: `loopPick(` })}
      ${loopMeta(q)}
      <div class="row-between mt24">
        <span class="small muted">Choisissez une réponse, puis indiquez votre degré de certitude.</span>
        <button class="btn btn-primary" ${L.answer ? '' : 'disabled'} onclick="S.loop.step='cert';render()">Continuer</button>
      </div>`, 'parcours');
  }

  /* --- étape 2 : certitude --- */
  if (L.step === 'cert') {
    return shellApp(`${head}
      ${questionBlock(q, { answer: L.answer, onPick: `loopPick(` })}
      <div class="card" style="margin-top:18px;border-color:var(--brand-600)">
        <b>À quel point êtes-vous sûr de votre réponse ?</b>
        <p class="small dim" style="margin:6px 0 14px">Cette information distingue une connaissance solide d'une bonne réponse obtenue par élimination. Elle change la suite du parcours.</p>
        <div class="row row-wrap" style="gap:10px">
          ${CERTITUDES.map(c => `<button class="btn ${L.cert === c.id ? 'btn-primary' : 'btn-ghost'}" onclick="loopCert('${c.id}','${o.mode}','${o.session}')">${icon(c.icon, 17)} ${c.label}</button>`).join('')}
        </div>
      </div>`, 'parcours');
  }

  /* --- étape 3 : correction complète --- */
  if (L.step === 'reveal') {
    const r = L.res || {};
    const conf = r.confusion;
    const lect = r.lecture || {};
    const remed = sub ? `#/app/parcours/crmef/apprendre/${sub.id}` : null;
    return shellApp(`${head}
      <div class="row row-wrap" style="gap:8px;margin-bottom:14px">
        <span class="badge badge-${lect.kind === 'crit' ? 'crit' : lect.kind === 'good' ? 'good' : 'warn'}">${esc(lect.label || '')}</span>
        ${editBadge(q)}
        ${q.prudence ? badge('Rattachement prudent', 'terra') : ''}
      </div>
      ${questionBlock(q, { answer: L.answer, reveal: true })}

      ${conf ? `<div class="card" style="margin-top:18px;border-inline-start:3px solid var(--sem-trap)">
        <div class="row" style="gap:9px;margin-bottom:8px"><span style="color:var(--sem-trap)">${icon('bulb', 18)}</span>
          <b>Confusion probable</b>${badge(conf.formule, 'terra')}</div>
        <p class="small dim" style="margin:0">${md(conf.hypothese || "Aucune confusion type n'est documentée pour cette question.")}</p>
        <div class="row row-wrap mt16" style="gap:8px">
          <button class="btn btn-sm btn-ghost" onclick="toast('Merci — votre confirmation affinera les prochaines recommandations')">C'est bien mon erreur</button>
          <button class="btn btn-sm btn-quiet" onclick="toast('Noté — cette hypothèse ne sera pas retenue')">Ce n'est pas ça</button>
        </div>
      </div>` : ''}

      ${loopMeta(q, true)}

      ${remed ? `<div class="reco" style="margin-top:18px">
        <div class="icon">${icon('route', 20)}</div>
        <div style="flex:1"><h4>Remédiation courte</h4>
          <p class="small dim" style="margin:0">Reprendre le point ${esc(sub.name)} — quelques minutes, ciblées sur la cause de l'erreur plutôt que sur le thème entier.</p>
          <div class="row row-wrap mt16" style="gap:8px">
            <a class="btn btn-sm btn-primary" href="${remed}">Suivre la remédiation</a>
            <button class="btn btn-sm btn-quiet" onclick="markRemed('${sub.id}')">Marquer comme faite</button></div>
        </div></div>` : ''}

      <div class="row-between mt24">
        ${r.mirror ? `<span class="small muted">Une question miroir vérifie le transfert dans un autre contexte.</span>
          <button class="btn btn-primary" onclick="loopMirror('${r.mirror.id}')">${icon('refresh', 17)} Question miroir</button>`
        : `<span class="small muted">Réponse juste et assurée : aucune vérification immédiate n'est nécessaire.</span>
          <button class="btn btn-primary" onclick="${o.onNext}">Continuer</button>`}
      </div>`, 'parcours');
  }

  /* --- étape 4 : question miroir --- */
  if (L.step === 'mirror') {
    const mq = L.mirrorQ;
    return shellApp(`${head}
      <div class="card card-flat" style="margin-bottom:14px"><b class="small">${icon('refresh', 15)} Question miroir</b>
        <p class="small dim" style="margin:5px 0 0">Même sous-domaine, question différente${mq.cog !== q.cog ? `, autre niveau cognitif (${esc(mq.cog)})` : ''}. On vérifie un transfert, pas une mémorisation.</p></div>
      ${questionBlock(mq, { answer: L.mirrorAns, reveal: !!L.mirrorDone, onPick: `loopMirrorPick(` })}
      <div class="row-between mt24">
        <span class="small muted">${L.mirrorDone ? "Une réussite au miroir ne clôt pas la fragilité : un rappel différé est programmé." : ''}</span>
        ${L.mirrorDone
          ? `<button class="btn btn-primary" onclick="${o.onNext}">Continuer</button>`
          : `<button class="btn btn-primary" ${L.mirrorAns ? '' : 'disabled'} onclick="loopMirrorValidate('${q.id}','${q.sub}')">Valider</button>`}
      </div>`, 'parcours');
  }

  return shellApp('', 'parcours');
}

/* Métadonnées officielles d'une question */
function loopMeta(q, full) {
  const sub = q.sub ? SUB(q.sub) : null;
  const src = DATA.crmef.sources.find(s => s.id === q.srcId);
  return `<div class="card card-flat card-pad-sm" style="margin-top:14px">

      <span><b>Niveau cognitif :</b> ${esc(q.cog)}</span>
      <span><b>Difficulté :</b> ${q.diff}/4</span>
      ${full && src ? `<span><b>Source :</b> ${esc(src.ref)} — ${esc(src.version)}</span>` : ''}
      <span>${editBadge(q)}</span>

}

/* --- actions de la boucle --- */
function loopPick(k) { if (S.loop.step === 'reveal' || S.loop.step === 'mirror') return; S.loop.answer = k; render(); }
function loopCert(c, mode, session) {
  const L = S.loop; L.cert = c;
  const qid = currentLoopQid();
  L.res = submitAnswer({ qid, answer: L.answer, certitude: c, mode, session });
  L.step = 'reveal'; render();
}
function currentLoopQid() {
  const s = st();
  if (S.loopQid) return S.loopQid;
  if (s.diagnostic && !s.diagnostic.done) return s.diagnostic.plan[s.diagnostic.i].qid;
  return null;
}
function loopMirror(mid) { S.loop.mirrorQ = DATA.questions.find(q => q.id === mid); S.loop.step = 'mirror'; S.loop.mirrorAns = null; render(); }
function loopMirrorPick(k) { if (S.loop.mirrorDone) return; S.loop.mirrorAns = k; render(); }
function loopMirrorValidate(originQid, sub) {
  const L = S.loop;
  const ok = L.mirrorAns === L.mirrorQ.correct;
  recordMirror(originQid, L.mirrorQ.id, ok, sub);
  scheduleRecall(originQid, sub, !ok);
  L.mirrorDone = true; render();
}
function markRemed(subId) {
  const s = st(); s.remediations[subId] = { status: 'faite', ts: nowTs() }; storeSave();
  toast('Remédiation enregistrée');
}

function trainPool(mode, arg) {
  const s = st();
  switch (mode) {
    case 'rappels': return dueRecalls().map(r => recallQuestion(r)).filter(Boolean);
    case 'erreurs': return Object.keys(s.errors).map(id => DATA.questions.find(q => q.id === id)).filter(Boolean);
    case 'fragiles': {
      const weak = ALL_SUBS().filter(x => ['fragile', 'en_cours'].includes(masteryOfSub(x.id).state)).map(x => x.id);
      return DATA.questions.filter(q => weak.includes(q.sub));
    }
    case 'ep': return epQuestions(arg);
    case 'dom': return DATA.questions.filter(q => q.sub && SUB(q.sub) && SUB(q.sub).dom === arg);
    case 'sub': return subQuestions(arg);
    default: return DATA.crmef.epreuves.flatMap(e => epQuestions(e.id));
  }
}

/* ---------------- Passation d'une simulation ---------------- */
function startSim(epId) {
  const s = st();
  const ids = epQuestions(epId).map(q => q.id);
  const e = EP(epId);
  s.sims[epId] = { key: 'sim-' + epId + '-' + nowTs(), ids, i: 0, answers: {}, certitudes: {},
    left: e.minutes * 60, started: nowTs(), submitted: false };
  storeSave(); S.simRun = epId; startSimTimer(); navigate('#/app/parcours/crmef/simulation/' + epId);
}
let SIM_TIMER = null;
function startSimTimer() {
  clearInterval(SIM_TIMER);
  SIM_TIMER = setInterval(() => {
    const s = st(); const sim = S.simRun && s.sims[S.simRun];
    if (!sim || sim.submitted) { clearInterval(SIM_TIMER); return; }
    sim.left--;
    const el = document.getElementById('simtimer');
    if (el) { const t = el.querySelector('.tv'); if (t) t.textContent = mmss(sim.left); el.className = 'timer' + (sim.left < 300 ? ' low' : ''); }
    if (sim.left % 10 === 0) storeSave();
    if (sim.left <= 0) { clearInterval(SIM_TIMER); submitSim(S.simRun, true); }
  }, 1000);
}
